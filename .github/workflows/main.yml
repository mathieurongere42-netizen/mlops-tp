# .github/workflows/main.yml
name: CI-ML-Pipeline

# Déclencheur : s'exécute à chaque push sur la branche main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Permet de lancer manuellement le workflow depuis l'interface GitHub

jobs:
  train-and-evaluate:
    # Le type de runner sur lequel le job va s'exécuter
    runs-on: ubuntu-latest

    steps:
      # Étape 1: Récupérer le code du dépôt
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Étape 2: Configurer l'environnement Python
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # Étape 3: Installer les dépendances
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Télécharger les packages NLTK nécessaires pour le prétraitement
          python -c "import nltk; nltk.download('stopwords'); nltk.download('punkt'); nltk.download('wordnet')"
          pip install matplotlib seaborn

      # Étape 4: Exécuter le pipeline de données et de ML
      - name: Run Data and ML Pipeline
        run: |
          echo "📥 Étape 1: Téléchargement des données..."
          python src/load_data.py
          
          echo "🔧 Étape 2: Prétraitement des données..."
          python src/preprocess.py
          
          echo "🤖 Étape 3: Entraînement des modèles..."
          python src/train.py
          
          echo "📊 Étape 4: Évaluation des modèles..."
          python src/evaluate.py
          
          echo "📈 Étape 5: Monitoring des données..."
          python src/monitor.py

      # Étape 5: Sauvegarder les résultats MLflow
      - name: Upload MLflow results
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-results
          path: mlruns/
          retention-days: 30

      # Étape 6: Sauvegarder les modèles et rapports
      - name: Upload models and reports
        uses: actions/upload-artifact@v4
        with:
          name: models-and-reports
          path: |
            models/
            reports/
          retention-days: 30
